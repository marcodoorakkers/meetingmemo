<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeetingMemo">
<meta name="theme-color" content="#0f1117">
<title>MeetingMemo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

/* ── AUTH SCREEN  ── */
.auth-screen { display: none; flex-direction: column; flex: 1; align-items: center; justify-content: center; padding: 32px 24px; gap: 0; }
.auth-screen.active { display: flex; }
.auth-logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 6px; }
.auth-logo span { color: #6c63ff; }
.auth-tagline { font-size: 13px; color: #555; margin-bottom: 36px; }
.auth-card { width: 100%; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.auth-title { font-size: 16px; font-weight: 600; color: #e8e8e8; }
.auth-tabs { display: flex; background: #0f1117; border: 0.5px solid #2a2a3a; border-radius: 8px; overflow: hidden; margin-bottom: 2px; }
.auth-tab { flex: 1; padding: 9px; border: none; background: transparent; color: #555; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; -webkit-tap-highlight-color: transparent; }
.auth-tab.active { background: #6c63ff; color: #fff; }
.auth-input { width: 100%; background: #0f1117; border: 0.5px solid #2a2a3a; border-radius: 10px; padding: 12px 14px; color: #e8e8e8; font-size: 15px; outline: none; -webkit-appearance: none; }
.auth-input:focus { border-color: #6c63ff; }
.auth-input::placeholder { color: #444; }
.auth-btn { width: 100%; padding: 14px; background: #6c63ff; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: 2px; }
.auth-btn:active { opacity: 0.85; }
.auth-btn:disabled { opacity: 0.5; }
.auth-error { font-size: 12px; color: #e24b4a; background: #2a1a1a; border: 0.5px solid #e24b4a44; border-radius: 8px; padding: 10px 12px; display: none; line-height: 1.5; }
.auth-error.visible { display: block; }
.auth-success { font-size: 12px; color: #1d9e75; background: #1a2a1a; border: 0.5px solid #1d9e7544; border-radius: 8px; padding: 10px 12px; display: none; line-height: 1.5; }
.auth-success.visible { display: block; }
.auth-footer { font-size: 11px; color: #444; text-align: center; margin-top: 16px; }

/* ── USER BADGE in header ── */
.user-badge { font-size: 11px; color: #555; padding: 4px 10px; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 20px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usage-bar-wrap { padding: 0 20px 12px; }
.usage-bar-label { font-size: 11px; color: #555; margin-bottom: 5px; display: flex; justify-content: space-between; }
.usage-bar-bg { height: 3px; background: #1a1a2e; border-radius: 2px; }
.usage-bar-fill { height: 3px; background: #6c63ff; border-radius: 2px; transition: width 0.4s; }
.usage-bar-fill.warn { background: #ef9f27; }
.usage-bar-fill.full { background: #e24b4a; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f1117; color: #e8e8e8;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
}

/* ── HEADER ── */
.header {
  padding: 16px 20px 12px; border-bottom: 0.5px solid #2a2a3a;
  position: sticky; top: 0; background: #0f1117; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
.header-left .logo span { color: #6c63ff; }
.header-left .subtitle { font-size: 12px; color: #666; margin-top: 2px; }
.settings-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 0.5px solid #2a2a3a;
  background: #1a1a2e; color: #888; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.settings-btn:active { opacity: 0.7; }

/* ── STEP BAR ── */
.steps-bar { display: flex; align-items: center; padding: 12px 20px; gap: 0; border-bottom: 0.5px solid #2a2a3a; }
.step-pip { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.step-pip-dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #2a2a3a; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #555; background: #0f1117; transition: all 0.2s; }
.step-pip.active .step-pip-dot { border-color: #6c63ff; color: #6c63ff; }
.step-pip.done .step-pip-dot { background: #6c63ff; border-color: #6c63ff; color: #fff; }
.step-pip-label { font-size: 10px; color: #555; text-align: center; }
.step-pip.active .step-pip-label, .step-pip.done .step-pip-label { color: #6c63ff; }
.step-line { flex: 1; height: 1px; background: #2a2a3a; margin: 0 4px; margin-bottom: 14px; }
.step-line.done { background: #6c63ff; }

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; flex: 1; }
.screen.active { display: flex; }
.result-screen { display: none; flex-direction: column; flex: 1; }
.result-screen.active { display: flex; }

/* ── SHARED FORM STYLES ── */
.field-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.text-input { width: 100%; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 12px; padding: 13px 16px; color: #e8e8e8; font-size: 15px; outline: none; -webkit-appearance: none; }
.text-input:focus { border-color: #6c63ff; }
.text-input::placeholder { color: #444; }
.mono { font-family: monospace; font-size: 13px; }
.attendee-row { display: flex; gap: 8px; }
.attendee-add-input { flex: 1; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 10px; padding: 10px 14px; color: #e8e8e8; font-size: 14px; outline: none; -webkit-appearance: none; }
.attendee-add-input:focus { border-color: #6c63ff; }
.attendee-add-input::placeholder { color: #444; }
.add-btn { background: #6c63ff; border: none; border-radius: 10px; color: #fff; padding: 0 16px; font-size: 20px; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 4px; margin-top: 8px; }
.chip { display: flex; align-items: center; gap: 6px; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 20px; padding: 6px 10px 6px 12px; font-size: 13px; color: #ccc; }
.chip-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.chip-remove { background: none; border: none; color: #555; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; -webkit-tap-highlight-color: transparent; }
.primary-btn { width: 100%; padding: 16px; background: #6c63ff; border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.primary-btn:active { opacity: 0.85; }
.primary-btn:disabled { opacity: 0.5; }
.secondary-btn { width: 100%; padding: 10px; background: transparent; border: 0.5px solid #2a2a3a; border-radius: 12px; color: #666; font-size: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.error-box { background: #2a1a1a; border: 0.5px solid #e24b4a44; border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #e24b4a; width: 100%; display: none; line-height: 1.5; }
.error-box.visible { display: block; }

/* ── SETTINGS SCREEN ── */
.settings-area { flex: 1; overflow-y: auto; padding-bottom: 32px; }
.settings-back { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 0.5px solid #2a2a3a; cursor: pointer; color: #6c63ff; font-size: 14px; -webkit-tap-highlight-color: transparent; }
.settings-section { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.settings-section-title { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
.settings-card { background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 14px; overflow: hidden; }
.settings-row { padding: 14px 16px; border-bottom: 0.5px solid #2a2a3a; display: flex; flex-direction: column; gap: 6px; }
.settings-row:last-child { border-bottom: none; }
.settings-row-label { font-size: 12px; color: #888; }
.key-input-row { display: flex; align-items: center; gap: 8px; }
.key-input-row input { flex: 1; background: transparent; border: none; color: #e8e8e8; font-size: 13px; font-family: monospace; outline: none; padding: 0; }
.key-input-row input::placeholder { color: #444; }
.key-saved-dot { width: 8px; height: 8px; border-radius: 50%; background: #1d9e75; flex-shrink: 0; display: none; }
.key-saved-dot.visible { display: block; }
.settings-hint { font-size: 11px; color: #555; line-height: 1.6; padding: 0 16px 14px; }
.settings-hint a { color: #6c63ff; text-decoration: none; }
.settings-attendees-area { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

/* ── SETUP SCREEN ── */
.setup-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 18px; overflow-y: auto; padding-bottom: 32px; }

.lang-toggle { display: flex; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 10px; overflow: hidden; }
.lang-opt { flex: 1; padding: 10px; border: none; background: transparent; color: #666; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; -webkit-tap-highlight-color: transparent; text-align: center; }
.lang-opt.active { background: #6c63ff; color: #fff; }

.add-defaults-btn {
  display: flex; align-items: center; gap: 8px;
  background: #1a1a2e; border: 0.5px dashed #3a3a5a; border-radius: 10px;
  padding: 10px 14px; color: #6c63ff; font-size: 13px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; width: 100%;
}
.add-defaults-btn:active { opacity: 0.7; }
.add-defaults-btn span { font-size: 16px; }

/* ── RECORD ── */
.record-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; gap: 24px; }
.rec-meeting-info { text-align: center; }
.rec-meeting-title { font-size: 15px; font-weight: 600; color: #fff; }
.rec-attendees-hint { font-size: 12px; color: #555; margin-top: 4px; }
.rec-btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.rec-btn { width: 100px; height: 100px; border-radius: 50%; border: none; background: #6c63ff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.2s; -webkit-tap-highlight-color: transparent; }
.rec-btn:active { transform: scale(0.95); }
.rec-btn.recording { background: #e24b4a; animation: pulse 1.5s infinite; }
.rec-btn svg { width: 36px; height: 36px; fill: white; }
.rec-btn .stop-icon { width: 28px; height: 28px; background: white; border-radius: 4px; display: none; }
.rec-btn.recording svg { display: none; }
.rec-btn.recording .stop-icon { display: block; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,0.4)} 50%{box-shadow:0 0 0 20px rgba(226,75,74,0)} }
.rec-label { font-size: 13px; color: #666; }
.rec-label.recording { color: #e24b4a; }
.timer { font-size: 32px; font-weight: 300; letter-spacing: 4px; color: #aaa; font-variant-numeric: tabular-nums; display: none; }
.timer.visible { display: block; }
.wave { width: 100%; height: 48px; display: none; }
.wave.visible { display: block; }
.rec-status { font-size: 12px; color: #555; text-align: center; padding: 8px 16px; background: #1a1a2e; border-radius: 10px; width: 100%; display: none; }
.rec-status.visible { display: block; }
.transcribing-overlay { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px 20px; }
.transcribing-spinner { width: 48px; height: 48px; border: 3px solid #1a1a2e; border-top: 3px solid #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.transcribing-label { font-size: 14px; color: #888; text-align: center; }

/* ── REVIEW ── */
.review-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.review-header { padding: 12px 20px 10px; border-bottom: 0.5px solid #2a2a3a; }
.review-hint { font-size: 12px; color: #888; line-height: 1.5; }
.speaker-bar { padding: 10px 20px; border-bottom: 0.5px solid #2a2a3a; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.speaker-bar-label { font-size: 11px; color: #555; width: 100%; margin-bottom: 2px; }
.spk-btn { padding: 5px 12px; border-radius: 16px; border: 1.5px solid transparent; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; transition: opacity 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
.spk-btn:active { transform: scale(0.95); }
.spk-btn.selected { opacity: 1; box-shadow: 0 0 0 2px #fff2; }
.spk-btn:not(.selected) { opacity: 0.4; }
.spk-none { background: #2a2a3a; color: #888; border-color: #3a3a4a; }
.spk-none.selected { opacity: 1; }
.segments-scroll { flex: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; }
.seg { background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.seg.labelled { border-color: #3a3a5a; }
.seg-speaker { font-size: 11px; font-weight: 600; }
.seg-text { font-size: 13px; color: #bbb; line-height: 1.5; }
.review-footer { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; border-top: 0.5px solid #2a2a3a; }

/* ── LOADING ── */
.loading-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px 20px; }
.spinner { width: 56px; height: 56px; border: 3px solid #1a1a2e; border-top: 3px solid #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
.loading-text { font-size: 15px; color: #888; text-align: center; }
.loading-steps { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
.lstep { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #555; }
.lstep.done { color: #6c63ff; }
.lstep.active { color: #e8e8e8; }
.lstep-dot { width: 8px; height: 8px; border-radius: 50%; background: #2a2a3a; flex-shrink: 0; }
.lstep.done .lstep-dot { background: #6c63ff; }
.lstep.active .lstep-dot { background: #fff; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── RESULT ── */
.result-header { padding: 16px 20px; border-bottom: 0.5px solid #2a2a3a; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.result-title { font-size: 16px; font-weight: 600; }
.result-meta { font-size: 12px; color: #666; margin-top: 2px; }
.copy-all-btn { background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 8px; color: #aaa; font-size: 12px; padding: 6px 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.notes-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px; }
.section-card { background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 14px; overflow: hidden; }
.section-head { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid #2a2a3a; }
.section-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.section-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; color: #ccc; }
.section-body { padding: 12px 16px; font-size: 14px; line-height: 1.7; color: #bbb; }
.section-body p { margin-bottom: 6px; }
.section-body p:last-child { margin-bottom: 0; }
.badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { background: #2a2a3a; border-radius: 20px; padding: 5px 12px; font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 6px; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #6c63ff; }
.action-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid #1f1f2e; }
.action-item:last-child { border-bottom: none; }
.action-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #3a3a4a; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.action-check.checked { background: #6c63ff; border-color: #6c63ff; }
.action-text { flex: 1; }
.action-who { font-size: 11px; font-weight: 600; margin-top: 2px; }
.action-when { font-size: 11px; color: #555; }
.decision-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; }
.dec-marker { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.new-btn { margin: 0 20px 24px; padding: 14px; background: transparent; border: 0.5px solid #2a2a3a; border-radius: 12px; color: #888; font-size: 14px; cursor: pointer; width: calc(100% - 40px); -webkit-tap-highlight-color: transparent; }

/* ── HISTORY SCREEN ── */
.history-screen { display: none; flex-direction: column; flex: 1; }
.history-screen.active { display: flex; }
.history-header { padding: 14px 20px; border-bottom: 0.5px solid #2a2a3a; display: flex; align-items: center; gap: 10px; }
.history-back { color: #6c63ff; font-size: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: none; padding: 0; }
.history-title { font-size: 16px; font-weight: 600; flex: 1; }
.history-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.history-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #444; font-size: 14px; padding: 40px; text-align: center; }
.history-empty-icon { font-size: 40px; opacity: 0.4; }
.history-item { background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 14px; overflow: hidden; }
.history-item-main { padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent; }
.history-item-main:active { opacity: 0.7; }
.history-item-icon { width: 36px; height: 36px; background: #2a2a4a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.history-item-info { flex: 1; min-width: 0; }
.history-item-name { font-size: 14px; font-weight: 600; color: #e8e8e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item-meta { font-size: 11px; color: #555; margin-top: 3px; }
.history-item-arrow { color: #444; font-size: 16px; flex-shrink: 0; }
.history-item-actions { border-top: 0.5px solid #2a2a3a; display: flex; }
.history-item-del { flex: 1; padding: 10px; background: none; border: none; color: #e24b4a; font-size: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.history-item-del:active { opacity: 0.7; }

/* ── HISTORY DETAIL (reuses result-screen styles, adds back btn) ── */
.history-detail-bar { padding: 12px 20px; border-bottom: 0.5px solid #2a2a3a; display: flex; align-items: center; gap: 10px; }
.history-detail-back { color: #6c63ff; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ── ATTENDEE CHECKBOXES (setup screen) ── */
.defaults-checklist { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.default-check-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #1a1a2e; border: 0.5px solid #2a2a3a; border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s; }
.default-check-row.checked { border-color: #6c63ff44; background: #1e1a3a; }
.default-check-box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #3a3a4a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
.default-check-row.checked .default-check-box { background: #6c63ff; border-color: #6c63ff; }
.default-check-box-tick { color: #fff; font-size: 11px; font-weight: 700; display: none; }
.default-check-row.checked .default-check-box-tick { display: block; }
.default-check-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.default-check-name { font-size: 14px; color: #ccc; flex: 1; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
  <div class="header-left">
    <div class="logo">Meeting<span>Memo</span></div>
    <div class="subtitle" id="headerSubtitle"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">

const tx = () => T[lang];

// ── localStorage ──────────────────────────────────────────────────────────────

function saveDefaultAttendees() {
  localStorage.setItem('mm_defaults', JSON.stringify(defaultAttendees.map(a => a.name)));
}

function loadDefaultAttendees() {
  try {
    const saved = JSON.parse(localStorage.getItem('mm_defaults') || '[]');
    defaultAttendees = saved.map((name, i) => ({ name, color: COLORS[i % COLORS.length] }));
  } catch(e) { defaultAttendees = []; }
}

// ── Language ──────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('langNL').classList.toggle('active', l === 'nl');
  document.getElementById('langEN').classList.toggle('active', l === 'en');
  document.documentElement.lang = l;
  applyTranslations();
}

function applyTranslations() {
  const t = tx();
  document.getElementById('headerSubtitle').textContent = t.subtitle;
  ['1','2','3'].forEach(i => document.getElementById(`pipLabel${i}`).textContent = t.pip[i-1]);
  // Settings
  document.getElementById('settingsBackLabel').textContent = t.settingsBack;

  document.getElementById('settingsSectionDefaults').textContent = t.settingsSectionDefaults;
  document.getElementById('settingsDefaultsHint').textContent = t.settingsDefaultsHint;
  document.getElementById('defaultAttendeeInput').placeholder = t.defaultAttendeePlaceholder;
  // Setup
  document.getElementById('labelMeetingName').textContent = t.labelMeetingName;
  document.getElementById('meetingName').placeholder = t.meetingPlaceholder;
  document.getElementById('labelLang').textContent = t.labelLang;
  document.getElementById('labelAttendees').textContent = t.labelAttendees;
  document.getElementById('attendeeInput').placeholder = t.attendeePlaceholder;
  document.getElementById('startRecordBtn').textContent = t.startBtn;

  document.getElementById('recStatus').textContent = t.recStatusRecording;
  document.getElementById('transcribingLabel').textContent = t.transcribingLabel;

  document.getElementById('speakerBarLabel').textContent = t.speakerBarLabel;
  document.getElementById('reviewGenerateBtn').textContent = t.generateBtn;
  document.getElementById('reviewSkipBtn').textContent = t.skipBtn;
  // Loading
  document.getElementById('loadingText').textContent = t.loadingText;
  t.lsteps.forEach((s,i) => { const el=document.getElementById(`lss${i+1}`); if(el) el.textContent=s; });
  // Result
  document.getElementById('copyAllBtn').textContent = t.copyAll;
  document.getElementById('newMeetingBtn').textContent = t.newMeeting;

  renderDefaultsChecklist();
}

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  // remember which screen we came from
  const active = document.querySelector('.screen.active, .result-screen.active, .history-screen.active');
  previousScreen = active ? active.id : 'setupScreen';
  document.getElementById('stepsBar').style.display = 'none';
  showScreen('settingsScreen');
}

function closeSettings() {
  document.getElementById('stepsBar').style.display = '';
  showScreen(previousScreen);
}

// ── Default attendees (Settings) ──────────────────────────────────────────────
function addDefaultAttendee() {
  const inp = document.getElementById('defaultAttendeeInput');
  const name = inp.value.trim();
  if (!name || defaultAttendees.find(a => a.name.toLowerCase() === name.toLowerCase())) { inp.value=''; return; }
  defaultAttendees.push({ name, color: COLORS[defaultAttendees.length % COLORS.length] });
  inp.value='';
  saveDefaultAttendees();
  renderDefaultChips();
  renderDefaultsChecklist();
}

function removeDefaultAttendee(i) {
  defaultAttendees.splice(i,1);
  defaultAttendees.forEach((a,idx) => a.color = COLORS[idx % COLORS.length]);
  saveDefaultAttendees();
  renderDefaultChips();
  renderDefaultsChecklist();
}

function renderDefaultChips() {
  document.getElementById('defaultChips').innerHTML = defaultAttendees.map((a,i) =>
    `<div class="chip"><div class="chip-color" style="background:${a.color};"></div>${a.name}<button class="chip-remove" onclick="removeDefaultAttendee(${i})">×</button></div>`
  ).join('');
}

function renderDefaultsChecklist() {
  const wrap = document.getElementById('defaultsChecklist');
  if (!defaultAttendees.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = defaultAttendees.map((a, i) => {
    const isChecked = !!attendees.find(x => x.name === a.name);
    return `<div class="default-check-row${isChecked ? ' checked' : ''}" onclick="toggleDefaultAttendee(${i})">
      <div class="default-check-box"><span class="default-check-box-tick">✓</span></div>
      <div class="default-check-dot" style="background:${a.color};"></div>
      <div class="default-check-name">${a.name}</div>
    </div>`;
  }).join('');
}

function toggleDefaultAttendee(i) {
  const d = defaultAttendees[i];
  const existing = attendees.findIndex(a => a.name === d.name);
  if (existing >= 0) {
    attendees.splice(existing, 1);
    attendees.forEach((a, idx) => a.color = COLORS[idx % COLORS.length]);
  } else {
    attendees.push({ name: d.name, color: COLORS[attendees.length % COLORS.length] });
  }
  renderAttendeeChips();
  renderDefaultsChecklist();
}

// ── Meeting attendees (Setup) ─────────────────────────────────────────────────
function addAttendee() {
  const inp = document.getElementById('attendeeInput');
  const name = inp.value.trim();
  if (!name || attendees.find(a => a.name.toLowerCase() === name.toLowerCase())) { inp.value=''; return; }
  attendees.push({ name, color: COLORS[attendees.length % COLORS.length] });
  inp.value='';
  renderAttendeeChips();
  renderDefaultsChecklist();
}

function removeAttendee(i) {
  attendees.splice(i,1);
  attendees.forEach((a,idx) => a.color = COLORS[idx % COLORS.length]);
  renderAttendeeChips();
  renderDefaultsChecklist();
}

function renderAttendeeChips() {
  document.getElementById('attendeeChips').innerHTML = attendees.map((a,i) =>
    `<div class="chip"><div class="chip-color" style="background:${a.color};"></div>${a.name}<button class="chip-remove" onclick="removeAttendee(${i})">×</button></div>`
  ).join('');
}

// ── Step indicator ────────────────────────────────────────────────────────────
function setStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById(`pip${i}`).className = 'step-pip' + (i<n?' done':i===n?' active':'');
    if(i<3) document.getElementById(`line${i}`).className = 'step-line' + (i<n?' done':'');
  });
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen, .result-screen, .history-screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goToRecord() {
  setStep(2); showScreen('recordScreen');
  const t = tx();
  document.getElementById('recMeetingTitle').textContent = document.getElementById('meetingName').value.trim() || t.defaultName;
  document.getElementById('recAttendeesHint').textContent = attendees.map(a=>a.name).join(' · ');
  document.getElementById('recLabel').textContent = t.tapToRecord;
}

// ── Recording ─────────────────────────────────────────────────────────────────
function toggleRecording() { isRecording ? stopRecording() : startRecording(); }

async function startRecording() {
  document.getElementById('recErrorBox').className = 'error-box';
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e) { showRecError(tx().micError); return; }

  audioChunks = [];
  const opts = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType:'audio/webm' }
    : MediaRecorder.isTypeSupported('audio/mp4') ? { mimeType:'audio/mp4' } : {};
  mediaRecorder = new MediaRecorder(stream, opts);
  mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
  mediaRecorder.start(1000);

  isRecording = true; seconds = 0;
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recLabel').textContent = tx().tapToStop;
  document.getElementById('recLabel').classList.add('recording');
  document.getElementById('timer').classList.add('visible');
  document.getElementById('waveVis').classList.add('visible');
  document.getElementById('recStatus').classList.add('visible');
  startTimer(); startWave();
}

async function stopRecording() {
  isRecording = false;
  clearInterval(timerInterval); clearInterval(waveInterval);
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recLabel').textContent = tx().recStopped;
  document.getElementById('recLabel').classList.remove('recording');
  document.getElementById('waveVis').classList.remove('visible');
  document.getElementById('recStatus').classList.remove('visible');

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    await new Promise(res => { mediaRecorder.onstop = res; mediaRecorder.stop(); });
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }

  // Show transcribing overlay
  document.getElementById('transcribingOverlay').style.display = 'flex';
  document.getElementById('recMeetingTitle').style.display = 'none';
  document.getElementById('recAttendeesHint').style.display = 'none';
  document.getElementById('timer').style.display = 'none';

  try {
    transcript = await transcribeWithWhisper();
  } catch(e) {
    document.getElementById('transcribingOverlay').style.display = 'none';
    document.getElementById('recMeetingTitle').style.display = '';
    document.getElementById('recAttendeesHint').style.display = '';
    document.getElementById('timer').style.display = '';
    showRecError(tx().whisperError + e.message);
    return;
  }

  document.getElementById('transcribingOverlay').style.display = 'none';
  buildSegments(transcript);
  setStep(3); showScreen('reviewScreen');
  renderReviewScreen();
}

async function transcribeWithWhisper() {
  if (DEV_MODE) {
    // DEV: stuur audio zonder auth token
    const mimeType = audioChunks[0]?.type || 'audio/webm';
    const ext = mimeType.includes('mp4') ? 'mp4' : mimeType.includes('ogg') ? 'ogg' : 'webm';
    const blob = new Blob(audioChunks, { type: mimeType });
    const fd = new FormData();
    fd.append('file', blob, `recording.${ext}`);
    fd.append('model', 'whisper-1');
    const res = await fetch('/api/transcribe-dev', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Transcriptie mislukt');
    return data.text || '';
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Niet ingelogd');
  const mimeType = audioChunks[0]?.type || 'audio/webm';
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(audioChunks, { type: mimeType });
  const fd = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-1');
  fd.append('language', tx().speechLang);
  const res = await fetch('/api/transcribe', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.access_token}` },
    body: fd,
  });
  const data = await res.json();
  if (!res.ok) {
    if (data.error === 'monthly_limit_reached') {
      throw new Error(`Maandlimiet bereikt (${data.used}/${data.limit} vergaderingen). Upgrade naar Pro voor onbeperkt gebruik.`);
    }
    throw new Error(data.error || 'Transcriptie mislukt');
  }
  usageCount++;
  updateUsageBar();
  return data.text || '';
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent =
      String(Math.floor(seconds/60)).padStart(2,'0') + ':' + String(seconds%60).padStart(2,'0');
  }, 1000);
}

function startWave() {
  const svg = document.getElementById('waveVis'); svg.innerHTML='';
  const rects=[];
  for(let i=0;i<24;i++){
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',4+i*13); r.setAttribute('width',8); r.setAttribute('rx',4); r.setAttribute('fill','#6c63ff');
    svg.appendChild(r); rects.push(r);
  }
  const anim=()=>rects.forEach(r=>{const h=8+Math.random()*32;r.setAttribute('height',h);r.setAttribute('y',24-h/2);});
  anim(); waveInterval=setInterval(anim,120);
}

// ── Review ────────────────────────────────────────────────────────────────────
function buildSegments(text) {
  const sentences = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
  segments = [];
  for(let i=0;i<sentences.length;i+=2){
    const chunk=sentences.slice(i,i+2).join(' ').trim();
    if(chunk) segments.push({text:chunk, speaker:null});
  }
  if(!segments.length) segments.push({text, speaker:null});
}

function renderReviewScreen() {
  const t=tx();
  const bar=document.getElementById('speakerBar');
  const label=document.getElementById('speakerBarLabel');
  bar.innerHTML=''; bar.appendChild(label);
  label.textContent=t.speakerBarLabel;
  const noneBtn=document.createElement('button');
  noneBtn.className='spk-btn spk-none'+(selectedSpeaker===null?' selected':'');
  noneBtn.textContent=t.noSpeaker;
  noneBtn.onclick=()=>selectSpeaker(null);
  bar.appendChild(noneBtn);
  attendees.forEach((a,i)=>{
    const btn=document.createElement('button');
    btn.className='spk-btn'+(selectedSpeaker===i?' selected':'');
    btn.style.background=a.color; btn.textContent=a.name;
    btn.onclick=()=>selectSpeaker(i);
    bar.appendChild(btn);
  });
  renderSegments();
  document.getElementById('reviewGenerateBtn').textContent=t.generateBtn;
  document.getElementById('reviewSkipBtn').textContent=t.skipBtn;
}

function selectSpeaker(idx) {
  selectedSpeaker=idx;
  const btns=document.getElementById('speakerBar').querySelectorAll('.spk-btn');
  btns.forEach((btn,i)=>btn.classList.toggle('selected',i===0?idx===null:idx===i-1));
}

function tapSegment(idx) {
  segments[idx].speaker=selectedSpeaker===null?null:attendees[selectedSpeaker];
  renderSegments();
}

function renderSegments() {
  document.getElementById('segmentsScroll').innerHTML=segments.map((seg,i)=>{
    const spk=seg.speaker;
    return `<div class="seg${spk?' labelled':''}" onclick="tapSegment(${i})">
      <div class="seg-speaker" style="color:${spk?spk.color:'#444'}">${spk?spk.name:'·'}</div>
      <div class="seg-text">${seg.text}</div>
    </div>`;
  }).join('');
}

function buildLabelledTranscript(skip) {
  if(skip) return transcript;
  return segments.map(seg=>(seg.speaker?`[${seg.speaker.name}]: `:'')+seg.text).join('\n\n');
}

// ── Generate ──────────────────────────────────────────────────────────────────
async function generateNotes(skipLabels) {
  const meetingName = document.getElementById('meetingName').value.trim() || tx().defaultName;
  const labelledText = buildLabelledTranscript(skipLabels);
  const attendeeNames = attendees.map(a=>a.name);

  document.getElementById('reviewGenerateBtn').disabled=true;
  showScreen('loadingScreen'); animateSteps();

  const now=new Date(); const t=tx();
  const dateStr=now.toLocaleDateString(t.dateLocale,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const timeStr=now.toLocaleTimeString(t.dateLocale,{hour:'2-digit',minute:'2-digit'});
  const attCtx=attendeeNames.length
    ?(lang==='nl'?`\n\nBekende deelnemers: ${attendeeNames.join(', ')}`:`\n\nKnown attendees: ${attendeeNames.join(', ')}`):'';

  const prompt=lang==='nl'
    ?`Je bent een professionele notulist. Analyseer het transcript en maak gestructureerde notulen in het Nederlands.${attCtx}\n\nTranscript (fragmenten met [Naam]: zijn gelabeld):\n"""\n${labelledText}\n"""\n\nGeef ALLEEN geldig JSON terug (geen markdown, geen uitleg):\n{"samenvatting":"2-3 zinnen","aanwezigen":["Naam"],"besproken_punten":["Punt"],"beslissingen":["Beslissing"],"actiepunten":[{"actie":"...","wie":"naam","wanneer":"..."}],"volgende_vergadering":"Datum of Nog niet gepland"}\nLege velden: [] of "".`
    :`You are a professional meeting secretary. Analyse the transcript and produce structured meeting notes in English.${attCtx}\n\nTranscript (segments with [Name]: are labelled):\n"""\n${labelledText}\n"""\n\nReturn ONLY valid JSON (no markdown, no explanation):\n{"summary":"2-3 sentences","attendees":["Name"],"topics":["Topic"],"decisions":["Decision"],"actions":[{"action":"...","who":"name","when":"..."}],"next_meeting":"Date or Not yet scheduled"}\nEmpty fields: [] or "".`;

  try {
    let responseText;
    const { data: { session } } = await sb.auth.getSession();
    if (DEV_MODE || session) {
      const headers = {'Content-Type':'application/json'};
      if (session) headers['Authorization'] = `Bearer ${session.access_token}`;
      const res=await fetch('/api/notes',{method:'POST',headers,body:JSON.stringify({prompt, lang})});
      const data=await res.json();
      if(!res.ok) throw new Error(data.error || 'Notulen genereren mislukt');
      responseText=data.text;
    } else {
      await new Promise(r=>setTimeout(r,2800));
      responseText=getDemoNotes();
    }
    const clean=responseText.replace(/```json|```/g,'').trim();
    notesData=JSON.parse(clean);
    notesData._meta={title:meetingName,date:dateStr,time:timeStr,duration:t.durationFmt(Math.floor(seconds/60),seconds%60)};
    renderNotes(notesData);
    saveMeetingToHistory(notesData);
    document.getElementById('stepsBar').style.display='none';
    showScreen('resultScreen');
  } catch(e) {
    showScreen('reviewScreen');
    document.getElementById('reviewGenerateBtn').disabled=false;
    const eb=document.getElementById('reviewErrorBox');
    eb.textContent=t.errorPrefix+e.message+t.errorSuffix;
    eb.className='error-box visible';
  }
}

function animateSteps() {
  const ids=['ls1','ls2','ls3','ls4','ls5']; let i=0;
  const next=()=>{if(i>0)document.getElementById(ids[i-1]).className='lstep done';if(i<ids.length){document.getElementById(ids[i]).className='lstep active';i++;setTimeout(next,600);}};
  next();
}

function renderNotes(data) {
  const c=document.getElementById('notesContent'); c.innerHTML='';
  const t=tx(); const s=t.sections; const isNL=lang==='nl';
  document.getElementById('resultTitle').textContent=data._meta.title;

    actions=isNL?data.actiepunten:data.actions, nextMtg=isNL?data.volgende_vergadering:data.next_meeting;

  if(summary) c.innerHTML+=card('📋','#3a3a5a',s.summary,`<p>${summary}</p>`);
  if(att?.length) c.innerHTML+=card('👥','#1a3a2a',s.attendees,`<div class="badge-row">${att.map(n=>`<div class="badge"><div class="badge-dot"></div>${n}</div>`).join('')}</div>`);
  if(topics?.length) c.innerHTML+=card('💬','#2a2a4a',s.topics,topics.map(p=>`<p>• ${p}</p>`).join(''));
  if(decisions?.length) c.innerHTML+=card('🎯','#2a3a1a',s.decisions,decisions.map(d=>`<div class="decision-item"><span class="dec-marker">✓</span><span>${d}</span></div>`).join(''));
  if(actions?.length) {
    const items=actions.map((a,i)=>{
      const actie=isNL?a.actie:a.action, wie=isNL?a.wie:a.who, when=isNL?a.wanneer:a.when;
      const color=attendees.find(x=>x.name===wie)?.color||'#6c63ff';
      return `<div class="action-item"><div class="action-check" id="ac${i}" onclick="this.classList.toggle('checked')"></div><div class="action-text"><div>${actie}</div><div class="action-who" style="color:${color}">${wie||''}</div><div class="action-when">${when||''}</div></div></div>`;
    }).join('');

  }
  if(nextMtg) c.innerHTML+=card('📅','#2a1a3a',s.next,`<p>${nextMtg}</p>`);
}

function card(icon,bg,title,body) {
  return `<div class="section-card"><div class="section-head"><div class="section-icon" style="background:${bg};">${icon}</div><h3>${title}</h3></div><div class="section-body">${body}</div></div>`;
}

function copyAll() {
  if(!notesData) return;
  const d=notesData; const t=tx(); const cs=t.copySections; const isNL=lang==='nl';
  const summary=isNL?d.samenvatting:d.summary, att=isNL?d.aanwezigen:d.attendees,
    topics=isNL?d.besproken_punten:d.topics, decisions=isNL?d.beslissingen:d.decisions,
    actions=isNL?d.actiepunten:d.actions, nextMtg=isNL?d.volgende_vergadering:d.next_meeting;
  let txt=`${t.copyHeader}: ${d._meta.title}\n${d._meta.date} · ${d._meta.time} · ${d._meta.duration}\n\n`;
  if(summary) txt+=`${cs.summary}\n${summary}\n\n`;
  if(att?.length) txt+=`${cs.attendees}\n${att.join(', ')}\n\n`;
  if(topics?.length) txt+=`${cs.topics}\n${topics.map(p=>'• '+p).join('\n')}\n\n`;
  if(decisions?.length) txt+=`${cs.decisions}\n${decisions.map(p=>'✓ '+p).join('\n')}\n\n`;
  if(actions?.length) txt+=`${cs.actions}\n${actions.map(a=>`[ ] ${isNL?a.actie:a.action} — ${isNL?a.wie:a.who} — ${isNL?a.wanneer:a.when}`).join('\n')}\n\n`;
  if(nextMtg) txt+=`${cs.next}\n${nextMtg}\n`;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('copyAllBtn');
    btn.textContent=t.copied; setTimeout(()=>btn.textContent=t.copyAll,2000);
  }).catch(()=>alert(t.copyFail));
}

  if (summary) txt += `${cs.summary}\n${summary}\n\n`;
  if (att?.length) txt += `${cs.attendees}\n${att.join(', ')}\n\n`;
  if (topics?.length) txt += `${cs.topics}\n${topics.map(p=>'• '+p).join('\n')}\n\n`;
  if (decisions?.length) txt += `${cs.decisions}\n${decisions.map(p=>'✓ '+p).join('\n')}\n\n`;
  if (actions?.length) txt += `${cs.actions}\n${actions.map(a=>`[ ] ${isNL?a.actie:a.action} — ${isNL?a.wie:a.who} — ${isNL?a.wanneer:a.when}`).join('\n')}\n\n`;
  if (nextMtg) txt += `${cs.next}\n${nextMtg}\n`;
  lang = savedLang;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('hdCopyAllBtn');
    btn.textContent = t.copied; setTimeout(() => btn.textContent = t.copyAll, 2000);
  }).catch(() => alert(t.copyFail));
}

// ── Auth functions ────────────────────────────────────────────────────────────
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('authBtn').textContent = mode === 'login' ? 'Inloggen' : 'Account aanmaken';
  document.getElementById('authError').className = 'auth-error';
  document.getElementById('authSuccess').className = 'auth-success';
}

async function submitAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authBtn');
  const errEl = document.getElementById('authError');
  const okEl = document.getElementById('authSuccess');
  errEl.className = 'auth-error'; okEl.className = 'auth-success';
  if (!email || !password) { errEl.textContent = 'Vul e-mail en wachtwoord in.'; errEl.className = 'auth-error visible'; return; }
  btn.disabled = true; btn.textContent = '…';
  let error;
  if (authMode === 'login') {
    ({ error } = await sb.auth.signInWithPassword({ email, password }));
  } else {
    ({ error } = await sb.auth.signUp({ email, password }));
    if (!error) { okEl.textContent = 'Check je e-mail om je account te bevestigen.'; okEl.className = 'auth-success visible'; btn.disabled = false; btn.textContent = 'Account aanmaken'; return; }
  }
  if (error) { errEl.textContent = error.message; errEl.className = 'auth-error visible'; }
  btn.disabled = false; btn.textContent = authMode === 'login' ? 'Inloggen' : 'Account aanmaken';
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null; usageCount = 0;
  document.getElementById('userBadge').style.display = 'none';
  document.getElementById('historyBtn').style.display = 'none';
  document.getElementById('settingsBtn').style.display = 'none';
  document.getElementById('signOutBtn').style.display = 'none';
  document.getElementById('stepsBar').style.display = 'none';
  document.getElementById('usageBarWrap').style.display = 'none';
  document.querySelectorAll('.screen, .result-screen, .history-screen').forEach(s => s.classList.remove('active'));
  document.getElementById('authScreen').classList.add('active');
}

async function onSignedIn(user) {
  currentUser = user;
  document.getElementById('userBadge').textContent = user.email.split('@')[0];
  document.getElementById('userBadge').style.display = '';
  document.getElementById('historyBtn').style.display = '';
  document.getElementById('settingsBtn').style.display = '';
  document.getElementById('signOutBtn').style.display = '';
  document.getElementById('stepsBar').style.display = '';

  // Load profile + usage
  const { data: profile } = await sb.from('profiles').select('plan').eq('id', user.id).single();
  userPlan = profile?.plan || 'free';

  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
  const { count } = await sb.from('meetings').select('*', { count: 'exact', head: true }).eq('user_id', user.id).gte('created_at', monthStart);
  usageCount = count || 0;

  // Settings screen
  document.getElementById('settingsEmail').textContent = user.email;
  document.getElementById('settingsPlan').textContent = userPlan === 'pro' ? '⭐ Pro' : 'Free';
  document.getElementById('settingsUsage').textContent = `${usageCount} / ${userPlan === 'pro' ? '∞' : FREE_LIMIT}`;

  updateUsageBar();
  document.querySelectorAll('.screen, .result-screen, .history-screen').forEach(s => s.classList.remove('active'));
  document.getElementById('setupScreen').classList.add('active');
  loadDefaultAttendees();
  renderDefaultChips();
  renderDefaultsChecklist();
  applyTranslations();
}

function updateUsageBar() {
  if (userPlan === 'pro') { document.getElementById('usageBarWrap').style.display = 'none'; return; }
  const wrap = document.getElementById('usageBarWrap');
  wrap.style.display = '';
  const pct = Math.min(100, Math.round(usageCount / FREE_LIMIT * 100));
  const fill = document.getElementById('usageFill');
  fill.style.width = pct + '%';
  fill.className = 'usage-bar-fill' + (pct >= 100 ? ' full' : pct >= 80 ? ' warn' : '');
  document.getElementById('usageCount').textContent = `${usageCount} / ${FREE_LIMIT}`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange((event, session) => {
  if (session?.user) {
    onSignedIn(session.user);
  }
});

// Check existing session on load
sb.auth.getSession().then(({ data: { session } }) => {
  if (DEV_MODE && !session) {
    // DEV: sla login over, ga direct naar de app
    document.getElementById('historyBtn').style.display = '';
    document.getElementById('settingsBtn').style.display = '';
    document.getElementById('stepsBar').style.display = '';
    document.getElementById('setupScreen').classList.add('active');
    document.getElementById('authScreen').classList.remove('active');
    loadDefaultAttendees(); renderDefaultChips(); renderDefaultsChecklist(); applyTranslations();
    return;
  }
  if (!session) {
    document.getElementById('authScreen').classList.add('active');
    applyTranslations();
  }
});
</script>
